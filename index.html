<script>
/* 大永劫 · 视图层（二）：规则页（国策可随时增删改 + 元规则 + 设置） */
(function (root) {
  'use strict';
  var R = root.DYJ_Rules;
  var V = root.DYJ_V;
  var esc = V.esc;

  /* ---------------- 国策 ---------------- */
  V.renderPolicy = function (s, now, ui) {
    var gid = ui.groupId || (s.policyGroups[0] && s.policyGroups[0].id);
    var g = s.policyGroups.find(function (x) { return x.id === gid; }) || s.policyGroups[0];
    var day = R.todayKey(s, now);

    var html = '<div class="card"><div class="card-head"><h3>国策</h3>' +
      '<span class="muted">规则越少越容易活下来</span></div>' +
      '<p class="muted">默认那几条只是起步建议，随时可以改、删、加。真正的国策树是你自己一条条长出来的。</p>' +
      '</div>';

    html += '<div class="tabs">';
    s.policyGroups.forEach(function (x) {
      var bad = x.locked || x.state === 'broken';
      html += '<button class="tab' + (x.id === gid ? ' on' : '') + '" data-act="pick-group:' + x.id + '">' +
        esc(x.name) + (bad ? '<span class="dot"></span>' : '') + '</button>';
    });
    html += '<button class="tab" data-act="add-group">+ 新组</button></div>';

    if (!g) { html += '<div class="empty">还没有国策组。</div>'; return html; }

    var nodes = s.policyNodes.filter(function (n) { return n.groupId === g.id && n.status !== 'removed'; });
    var active = R.activeNodesOf(s, g.id);
    var tol = g.noCollapse ? 0 : R.toleranceFor(active.length);
    var rec = R.ensureDay(s, day);
    var outToday = active.filter(function (n) { return R.nodeStateFor(s, day, n) === 'out'; }).length;

    html += '<div class="card"><div class="card-head">' +
      '<h3>' + esc(g.name) + (s.settings.showTitles && g.title ? ' <span class="muted">' + esc(g.title) + '</span>' : '') + '</h3>' +
      V.statePill(g) + '</div>' +
      '<div class="row tight" style="margin-bottom:10px">' +
      '<span class="tag">容错 ' + tol + '</span>' +
      '<span class="tag">' + active.length + ' 条</span>' +
      (outToday ? '<span class="tag warn">今天熄灭 ' + outToday + '</span>' : '') +
      (g.shakenDays ? '<span class="tag">动摇 ' + g.shakenDays + ' 天</span>' : '') +
      '</div>' +
      '<div class="row tight">' +
      '<button class="btn sm primary" data-act="add-node:' + g.id + '">+ 加一条国策</button>' +
      '<button class="btn sm" data-act="edit-group:' + g.id + '">改组设置</button>' +
      (g.frozenUntil
        ? '<button class="btn sm" data-act="unfreeze:' + g.id + '">取消冻结</button>'
        : '<button class="btn sm" data-act="freeze:' + g.id + '">冻结这一组</button>') +
      (g.locked ? '<button class="btn sm" data-act="unlock:' + g.id + '">解除上锁</button>' : '') +
      '<button class="btn sm danger" data-act="del-group:' + g.id + '">删除本组</button>' +
      '</div></div>';

    html += '<div class="card">';
    if (!nodes.length) {
      html += '<div class="empty">这一组还是空的。<br>加一条"傻瓜国策"——简单到几乎不可能失败的那种。</div>';
    } else {
      html += renderTree(s, nodes, now, day);
    }
    html += '</div>';

    var internalized = s.policyNodes.filter(function (n) { return n.groupId === g.id && n.status === 'internalized'; });
    if (internalized.length) {
      html += '<div class="card"><div class="card-head"><h3>已经是习惯了</h3><span class="muted">不再占用容错，也不会崩</span></div>' +
        internalized.map(function (n) {
          return '<div class="nrow done"><span class="nm">' + esc(n.name) + '</span>' +
            '<span class="muted">最长连续 ' + (n.bestStreak || 0) + ' 天</span>' +
            '<span class="acts"><button class="btn sm" data-act="reset-internal:' + n.id + '">退回重练</button></span></div>';
        }).join('') + '</div>';
    }

    html += V.renderAltar(s, now);
    return html;
  };

  function renderTree(s, nodes, now, day) {
    var byParent = {};
    nodes.forEach(function (n) {
      var p = (n.parentId && nodes.some(function (x) { return x.id === n.parentId; })) ? n.parentId : '__root';
      (byParent[p] = byParent[p] || []).push(n);
    });
    function walk(pid) {
      return (byParent[pid] || []).map(function (n) {
        var st = R.nodeStateFor(s, day, n);
        var cls = { lit: 'on', out: 'off', pending: 'todo', trial: 'trial', frozen: 'frozen', internalized: 'done' }[st] || 'todo';
        var mark = { lit: '✓', out: '✕', pending: '○', trial: '试', frozen: '冻', internalized: '✓' }[st] || '○';
        var editable = R.isNodeEditable(s, day, n, now);
        var kids = walk(n.id);
        var sub = (R.NODE_TYPES[n.type] || {}).name || '';
        sub += ' · 连续 ' + (n.streak || 0) + ' 天 · 最长 ' + (n.bestStreak || 0) +
          ' · 内化 ' + (n.internalization || 0);
        if (R.inTrialOn(n, day)) sub += ' · 试用中';
        if (n.trigger) sub += ' · 触发：' + esc(n.trigger);
        if (n.note) sub += ' · ' + esc(n.note);
        var h = '<div class="nrow ' + cls + '">' +
          '<button class="mark-btn" data-act="toggle-node:' + n.id + '"' + (editable ? '' : ' disabled') + '>' + mark + '</button>' +
          '<span class="body"><span class="nm">' + esc(n.name) +
          (n.isRoot ? ' <span class="tag">根</span>' : '') + '</span>' +
          '<span class="sub">' + sub + '</span></span>' +
          '<span class="acts">' +
          '<button class="btn sm" data-act="edit-node:' + n.id + '">编辑</button>' +
          '<button class="btn sm" data-act="add-sub:' + n.id + '">+子</button>' +
          '<button class="btn sm danger" data-act="del-node:' + n.id + '">删</button>' +
          '</span></div>';
        if (kids) h += '<div class="kids">' + kids + '</div>';
        return h;
      }).join('');
    }
    return walk('__root');
  }

  /* ---------------- 元规则 ---------------- */
  V.renderAltar = function (s, now) {
    var day = R.todayKey(s, now);
    var rec = R.ensureDay(s, day);
    var quota = s.settings.entertainmentQuotaMinutes;
    var used = rec.entertainmentMinutes || 0;
    var over = used > quota;
    var permits = s.permits || [];
    var rulings = s.rulings.slice().reverse();

    var html = '<details class="fold"><summary>元规则<span class="muted">冻结 · 娱乐配额 · 下必为例</span></summary>' +
      '<div class="fold-body">';

    html += '<h4>娱乐配额</h4>' +
      '<div class="row tight"><span class="tag' + (over ? ' warn' : '') + '">今天 ' + used + ' / ' + quota + ' 分钟</span>' +
      '<button class="btn sm" data-act="quota:5">+5</button>' +
      '<button class="btn sm" data-act="quota:15">+15</button>' +
      '<button class="btn sm" data-act="quota:30">+30</button>' +
      '<button class="btn sm" data-act="quota:-5">-5</button>' +
      '<button class="btn sm" data-act="quota:0">清零</button></div>' +
      (over ? '<div class="alert warn">超出 ' + (used - quota) + ' 分钟。要不要把它变成一条正式规则？' +
        '<button class="btn sm" data-act="open-ruling:quota">发起判断</button></div>' : '') +
      '<p class="muted tiny">超出配额不扣任何东西，它只是提醒你：这里有一条你还没想清楚的边界。</p>';

    html += '<h4>冻结</h4><p class="muted tiny">生病、考试周、出门在外——冻结期间这一组不算熄灭，写一句原因就行。</p>' +
      '<div class="row tight">' + s.policyGroups.map(function (g) {
        return '<button class="btn sm" data-act="' + (g.frozenUntil ? 'unfreeze:' : 'freeze:') + g.id + '">' +
          esc(g.name) + (g.frozenUntil ? ' ✓解冻' : ' 冻结') + '</button>';
      }).join('') + '</div>';

    html += '<h4>下必为例</h4>' +
      '<p class="muted tiny">遇到疑似违规，只能二选一：判定违规（清零重来），或者判定允许（从此永久合法、不可撤销）。' +
      '永久许可越多，说明你的边界越松。</p>' +
      '<div class="row tight"><button class="btn sm" data-act="open-ruling:manual">发起一次判断</button>' +
      '<span class="tag">永久许可 ' + permits.length + ' 条</span>' +
      '<span class="tag">今日降级 ' + R.degradationUsedToday(s, now) + '/' + s.settings.downgradePerDayLimit + '</span></div>';

    if (permits.length) {
      html += '<div class="list">' + permits.map(function (p) {
        return '<div class="li"><span class="nm">' + esc(p.behavior) + '</span>' +
          '<span class="muted">' + R.logicalDay(p.grantedAt, s.settings.dayBoundaryHour) + '</span></div>';
      }).join('') + '</div>';
    }
    if (rulings.length) {
      html += '<div class="list">' + rulings.slice(0, 8).map(function (r) {
        var tag = !r.decision ? '待判断' : (r.decision === 'permitted' ? '允许' : '违规');
        return '<div class="li"><span class="nm">' + esc(r.subject) + '</span>' +
          '<span class="muted">' + tag + ' · ' + r.logicalDay + (r.note ? ' · ' + esc(r.note) : '') + '</span></div>';
      }).join('') + '</div>';
    }
    return html + '</div></details>';
  };

})(window);

</script>
<script>
/* 大永劫 · 视图层：数据统计 + 行为热力图详情 */
(function (root) {
  'use strict';
  var R = root.DYJ_Rules;
  var V = root.DYJ_V;
  var esc = V.esc;

  var DOW = ['一', '二', '三', '四', '五', '六', '日'];
  var P_ICONS = ['book', 'pen', 'leaf', 'grid'];

  function hexA(hex, a) {
    var h = String(hex || '#2E7D32').replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  /* ================= 数据统计 ================= */
  V.renderStats = function (s, now, ui) {
    var today = R.todayKey(s, now);
    var mode = s.settings.heatmapMode;
    var th = R.adaptiveThresholds(s, today);
    var doneCount = s.focusLogs.filter(function (l) { return l.result === 'completed'; }).length;

    var html = '<div class="statcards">' +
      card('clock', '累计专注时长', V.bigDuration(s.kingdom.lifetimeFocusMinutes)) +
      card('check', '完成任务单元', '<b>' + doneCount + '</b><i>个</i>') +
      card('flag', '点亮国策数', '<b>' + R.countLitNodes(s) + '</b><i>个</i>') +
      card('nodes', '树节点总数', '<b>' + R.countNodes(s) + '</b><i>个</i>') +
      '</div>';

    html += '<div class="card"><div class="card-head"><h3>综合行为热力图</h3>' +
      '<button class="btn sm ghost" data-act="open-heat">详情 ›</button></div>' +
      multiMonths(s, now, 4, mode, th, today) +
      legend(mode, th) + '</div>';

    html += analysis(s, now, ui);
    html += troops(s);
    return html;
  };

  function card(icon, label, valueHTML) {
    return '<div class="statcard"><span class="icw">' + V.icon(icon) + '</span>' +
      '<span class="tx"><span class="k">' + label + '</span><span class="v">' + valueHTML + '</span></span></div>';
  }

  function multiMonths(s, now, count, mode, th, today) {
    var anchor = today.slice(0, 8) + '01';
    var out = [];
    for (var i = count - 1; i >= 0; i--) out.push(miniMonth(s, R.shiftMonth(anchor, -i), today, mode, th));
    return '<div class="months">' + out.join('') + '</div>';
  }

  function miniMonth(s, anchor, today, mode, th) {
    var mm = R.monthMatrix(anchor);
    var h = '<div class="mon"><div class="mh">' + R.monthShort(anchor) + '</div>' +
      '<div class="dow7">' + DOW.map(function (d) { return '<span>' + d + '</span>'; }).join('') + '</div>' +
      '<div class="mgrid">';
    mm.cells.forEach(function (c) {
      if (!c || c.day > today) { h += '<div class="mc blank"></div>'; return; }
      var lv = R.levelWith(R.dayMinutes(s, c.day), mode, th);
      var pa = R.policyActivityOn(s, c.day);
      h += '<div class="mc' + (lv ? ' lv' + lv : '') + (pa.count ? ' pol' : '') +
        (c.day === today ? ' today' : '') + '" data-act="pick-day:' + c.day + '">' + c.n + '</div>';
    });
    return h + '</div></div>';
  }

  function legend(mode, th) {
    var names = (mode === 'adaptive' && th)
      ? ['≤' + R.fmtCompact(th[0]), '≤' + R.fmtCompact(th[1]), '≤' + R.fmtCompact(th[2]), '>' + R.fmtCompact(th[2])]
      : ['<10 分', '10–25 分', '25–60 分', '>1 小时'];
    return '<div class="legend">' +
      '<span><i class="sw" style="background:var(--g0)"></i>没专注</span>' +
      '<span><i class="sw" style="background:var(--g1)"></i>' + names[0] + '</span>' +
      '<span><i class="sw" style="background:var(--g2)"></i>' + names[1] + '</span>' +
      '<span><i class="sw" style="background:var(--g3)"></i>' + names[2] + '</span>' +
      '<span><i class="sw" style="background:var(--g4)"></i>' + names[3] + '</span>' +
      '<span><i class="sw swpol"></i>当天动过国策</span></div>';
  }

  /* ================= 目标投入与分析 ================= */
  function analysis(s, now, ui) {
    var today = R.todayKey(s, now);
    var kind = ui.rangeKind || 'month';
    var ref = ui.rangeRef || today;
    var range = R.rangeFor(s, kind, ref, ui.customRange);
    var st = R.rangeStats(s, range.from, range.to);
    var rows = s.targets.map(function (t) { return R.targetProgress(s, t, range); });
    var pos = rows.filter(function (r) { return r.cur > 0; });
    var total = pos.reduce(function (a, r) { return a + r.cur; }, 0);

    var html = '<div class="card"><div class="card-head"><h3>目标投入与分析</h3></div>' +
      '<div class="segrow">' +
      '<button class="btn sm ghost" data-act="range-now">回到本月</button>' +
      '<button class="btn sm" data-act="range-shift:-1">‹</button>' +
      '<button class="btn sm" data-act="range-shift:1">›</button>' +
      '<div class="seg">' +
      ['day|日', 'week|周', 'month|月', 'custom|自定义'].map(function (x) {
        var p = x.split('|');
        return '<button class="' + (kind === p[0] ? 'on' : '') + '" data-act="range-kind:' + p[0] + '">' + p[1] + '</button>';
      }).join('') +
      '</div></div>';

    if (kind === 'custom') {
      html += '<div class="row tight" style="margin-bottom:10px">' +
        '<input type="date" id="rg-from" value="' + esc(range.from) + '" style="padding:7px 9px;border:1px solid var(--line2);border-radius:8px">' +
        '<span class="muted">至</span>' +
        '<input type="date" id="rg-to" value="' + esc(range.to) + '" style="padding:7px 9px;border:1px solid var(--line2);border-radius:8px">' +
        '<button class="btn sm primary" data-act="range-apply">应用</button></div>';
    }

    html += '<div class="rangelabel">' + range.label + '</div>' +
      '<div class="rangebig">总投入 <b>' + R.fmtMinutes(st.minutes) + '</b>，日均 <b>' + R.fmtMinutes(st.avgPerDay) + '</b></div>';

    html += donutSVG(pos, total);
    html += '<div class="pgrid" style="margin-top:16px">' + rows.map(progressCard).join('') + '</div>';
    html += '<div class="center" style="margin-top:12px"><button class="btn sm ghost" data-act="edit-targets">改目标</button></div>';
    return html + '</div>';
  }

  function donutSVG(rows, total) {
    if (!total || !rows.length) return '<div class="empty">这个区间还没有专注记录。</div>';
    var W = 380, H = 246, cx = W / 2, cy = H / 2 + 2, RO = 78, RI = 48;
    function pt(rad, ang) { return { x: cx + rad * Math.cos(ang), y: cy + rad * Math.sin(ang) }; }
    function arc(a0, a1, color) {
      var large = (a1 - a0) > Math.PI ? 1 : 0;
      var o0 = pt(RO, a0), o1 = pt(RO, a1), i1 = pt(RI, a1), i0 = pt(RI, a0);
      return '<path d="M' + o0.x.toFixed(1) + ',' + o0.y.toFixed(1) +
        ' A' + RO + ',' + RO + ' 0 ' + large + ',1 ' + o1.x.toFixed(1) + ',' + o1.y.toFixed(1) +
        ' L' + i1.x.toFixed(1) + ',' + i1.y.toFixed(1) +
        ' A' + RI + ',' + RI + ' 0 ' + large + ',0 ' + i0.x.toFixed(1) + ',' + i0.y.toFixed(1) + 'Z" fill="' + color + '"/>';
    }
    var parts = [], labels = [];
    if (rows.length === 1) {
      parts.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + ((RO + RI) / 2) + '" fill="none" stroke="' +
        rows[0].target.color + '" stroke-width="' + (RO - RI) + '"/>');
    } else {
      var a = -Math.PI / 2;
      rows.forEach(function (row) {
        var frac = row.cur / total, a2 = a + frac * Math.PI * 2;
        parts.push(arc(a, a2, row.target.color));
        labels.push({ mid: (a + a2) / 2, row: row, frac: frac });
        a = a2;
      });
      layout(labels.filter(function (l) { return Math.cos(l.mid) >= 0; }), 1);
      layout(labels.filter(function (l) { return Math.cos(l.mid) < 0; }), -1);
    }
    function layout(list, side) {
      list.sort(function (p, q) { return Math.sin(p.mid) - Math.sin(q.mid); });
      var n = list.length, top = 24, bot = H - 24;
      list.forEach(function (L, i) {
        var y = n > 1 ? top + (bot - top) / (n - 1) * i : (top + bot) / 2;
        var p1 = pt(RO, L.mid);
        var ex = side > 0 ? cx + RO + 12 : cx - RO - 12;
        var tx = side > 0 ? W - 2 : 2;
        parts.push('<polyline class="ldr" points="' + p1.x.toFixed(1) + ',' + p1.y.toFixed(1) + ' ' +
          ex.toFixed(1) + ',' + y.toFixed(1) + ' ' + tx.toFixed(1) + ',' + y.toFixed(1) + '"/>');
        var anchor = side > 0 ? 'end' : 'start';
        parts.push('<text class="lb-name" x="' + tx + '" y="' + (y - 3) + '" text-anchor="' + anchor + '">' +
          esc(L.row.target.name) + '</text>');
        parts.push('<text class="lb-val" x="' + tx + '" y="' + (y + 12) + '" text-anchor="' + anchor + '">' +
          R.fmtCompact(L.row.cur) + ' (' + (L.frac * 100).toFixed(1) + '%)</text>');
      });
    }
    return '<svg class="donut" viewBox="0 0 ' + W + ' ' + H + '" role="img">' + parts.join('') + '</svg>';
  }

  function progressCard(p, i) {
    var up = p.delta >= 0;
    var pct = Math.max(0, Math.min(100, p.pct));
    var prev = Math.max(0, Math.min(100, p.prevPct));
    var base = Math.min(pct, prev);
    var diff = Math.max(0, Math.min(100 - base, Math.abs(pct - prev)));
    return '<div class="pcard">' +
      '<span class="pic" style="background:' + hexA(p.target.color, 0.14) + ';color:' + p.target.color + '">' +
      V.icon(P_ICONS[i % P_ICONS.length]) + '</span>' +
      '<div class="pbody">' +
      '<div class="ptop"><b>' + esc(p.target.name) + '</b>' +
      '<span class="pd' + (up ? '' : ' down') + '">' + (up ? '+' : '−') + R.fmtCompact(Math.abs(p.delta)) + '</span></div>' +
      '<div class="pc">' + p.prevPct + '% → <b>' + p.pct + '%</b></div>' +
      '<div class="pbar">' +
      '<i class="base" style="width:' + base + '%"></i>' +
      (diff ? '<i class="' + (up ? 'grow' : 'shrink') + '" style="left:' + base + '%;width:' + diff + '%"></i>' : '') +
      '</div></div></div>';
  }

  function troops(s) {
    return '<div class="card"><div class="card-head"><h3>各类事情的累计</h3>' +
      '<span class="muted">等级不会掉</span></div>' +
      s.troops.filter(function (t) { return !t.locked; }).map(function (t) {
        var lv = R.troopLevel(t.focusMinutes), nx = R.nextTroopLevel(t.focusMinutes);
        var pct = 100;
        if (nx) pct = Math.max(2, Math.min(100, Math.round((t.focusMinutes - lv.min) / (nx.min - lv.min) * 100)));
        return '<div class="goal"><div class="row tight"><b>' + esc(t.label) + '</b>' + V.sub(s, t.title) +
          '<span class="sp"></span><span class="muted">' + R.fmtCompact(t.focusMinutes) + ' · ' +
          t.sessions + ' 次 · ' + esc(lv.name) + '</span></div>' +
          '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
          (nx ? '<div class="muted tiny">再 ' + R.fmtCompact(nx.min - t.focusMinutes) + ' 到 ' + esc(nx.name) + '</div>' : '') +
          '</div>';
      }).join('') + '</div>';
  }

  /* ================= 行为热力图详情 ================= */
  V.renderHeatDetail = function (s, now, ui) {
    var today = R.todayKey(s, now);
    var anchor = ui.heatMonth || (today.slice(0, 8) + '01');
    var mm = R.monthMatrix(anchor);
    var sel = ui.selectedDay || today;
    var mode = s.settings.heatmapMode;
    var th = R.adaptiveThresholds(s, today);

    var html = '<div class="row tight" style="margin-bottom:12px">' +
      '<button class="btn sm" data-act="go:stats">‹ 返回</button>' +
      '<b style="font-size:16px">行为热力图详情</b></div>';

    html += '<div class="card">' +
      '<div class="row tight" style="justify-content:center;margin-bottom:12px">' +
      '<button class="btn sm ghost" data-act="heat-month:-1">‹</button>' +
      '<b style="font-size:17px;min-width:120px;text-align:center">' + R.monthLabel(anchor) + '</b>' +
      '<button class="btn sm ghost" data-act="heat-month:1">›</button>' +
      '</div>' +
      '<div class="dow7" style="font-size:11.5px;margin-bottom:5px">' +
      DOW.map(function (d) { return '<span>周' + d + '</span>'; }).join('') + '</div>' +
      '<div class="bigcal">';
    mm.cells.forEach(function (c) {
      if (!c) { html += '<div class="bc blank"></div>'; return; }
      var mins = R.dayMinutes(s, c.day);
      var lv = R.levelWith(mins, mode, th);
      var pa = R.policyActivityOn(s, c.day);
      html += '<div class="bc' + (lv ? ' lv' + lv : '') + (pa.count ? ' pol' : '') +
        (c.day === today ? ' today' : '') + (c.day === sel ? ' sel' : '') +
        '" data-act="pick-day:' + c.day + '">' +
        '<span class="n">' + c.n + '</span>' +
        (mins ? '<span class="t">' + R.fmtCompact(mins) + '</span>' : '') +
        '</div>';
    });
    html += '</div>' + legend(mode, th) + '</div>';

    return html + dayDetail(s, sel);
  };

  function dayDetail(s, day) {
    var logs = R.logsOn(s, day);
    var mins = R.dayMinutes(s, day);
    var html = '<div class="card"><div class="card-head">' +
      '<h3>' + (+day.slice(5, 7)) + ' 月 ' + (+day.slice(8)) + ' 日</h3>' +
      '<span class="muted" style="color:var(--g3);font-weight:650">' + R.fmtCompact(mins) + '</span></div>';

    if (!logs.length) return html + '<div class="empty">这一天没有记录。</div></div>';
    return html + '<div class="daylist">' + logs.map(function (l) {
      var done = l.result === 'completed';
      return '<div class="drow' + (done ? '' : ' no') + '">' +
        '<span class="ck">' + V.icon(done ? 'check' : 'undo') + '</span>' +
        '<span class="tm">' + R.hhmm(l.startedAt) + '</span>' +
        '<span><span class="nm">' + esc(l.taskName || R.troopLabel(s, l.troopId)) + '</span>' +
        (done && l.chainNo ? '<span class="no">#' + l.chainNo + '</span>' : '') + '</span>' +
        '<span class="rt"><span class="du">' + R.fmtCompact(l.actualMinutes) + '</span>' +
        '<span class="st">' + (done ? '已完成' : '中断') + '</span></span>' +
        '</div>';
    }).join('') + '</div></div>';
  }
})(window);

</script>

/* 大永劫 · 视图层：我的 */
(function (root) {
  'use strict';
  var R = root.DYJ_Rules;
  var V = root.DYJ_V;
  var esc = V.esc;

  var HONOR_ICONS = {
    first_seat: 'check', chijiejie: 'flag', starter30: 'nodes',

    /* 称号 */
    html += '<div class="card"><div class="card-head"><h3>称号</h3>' +

        return '<div class="a' + (got ? ' got' : '') + '">' +
          '<span class="ai">' + V.icon(HONOR_ICONS[h.id] || 'flag') + '</span>' +
          '<div class="t">' + esc(h.name) + '</div>' +

      }).join('') + '</div></div>';

    /* 数据 */
    var size = 0;
    try { size = JSON.stringify(s).length; } catch (e) { size = 0; }
    html += '<div class="card"><div class="card-head"><h3>数据</h3>' +
      '<span class="muted">' + (s.meta.lastExportAt ? '上次导出 ' + R.logicalDay(s.meta.lastExportAt, s.settings.dayBoundaryHour) : '从未导出') + '</span></div>' +
      '<p class="muted">记录只存在这台设备的浏览器里。清理浏览器数据会一并删除，请定期导出备份。</p>' +
      '<div class="row tight" style="margin-top:10px">' +
      '<button class="btn primary sm" data-act="export">' + V.icon('save') + ' 导出备份</button>' +
      '<button class="btn sm" data-act="import">' + V.icon('load') + ' 导入备份</button>' +
      '<button class="btn sm danger" data-act="wipe">清空数据</button></div>' +
      '<div class="list" style="margin-top:12px">' +
      kv('专注记录', s.focusLogs.length + ' 条') +
      kv('逻辑日', Object.keys(s.dayRecords).length + ' 天') +
      kv('国策节点', s.policyNodes.length + ' 个') +
      kv('占用体积', Math.round(size / 1024) + ' KB') +
      '</div></div>';

    /* 参数 */
    var st = s.settings;
    html += '<div class="card"><div class="card-head"><h3>参数</h3></div>' +
      '<div class="grid c2">' +
      num('s-boundary', '一天从几点开始', st.dayBoundaryHour, '默认 4 点。凌晨 2 点睡算前一天的账。') +
      num('s-settle', '结算时间', st.settlementHour, '默认 23 点。之后只有被动型国策还能改。') +
      num('s-plan', '默认专注时长（分钟）', st.defaultPlanMinutes, '首页大按钮用的时长。') +
      num('s-degrade', '每天可降级次数', st.downgradePerDayLimit, '降级启动不算失败。') +
      num('s-quota', '每天娱乐配额（分钟）', st.entertainmentQuotaMinutes, '只用于提醒，不扣任何东西。') +
      date('s-newbie', '新手期到', st.newbieProtectionUntil, '这段时间断档不会让国策崩坏。') +
      '</div>' +
      '<div class="field"><label><input type="checkbox" id="s-titles"' + (st.showTitles ? ' checked' : '') +
      '> 显示世界观副标题</label>' +
      '<div class="hint">关掉之后界面只剩功能名（写作业、作息、身体）。</div></div>' +
      '<button class="btn primary sm" data-act="save-settings">保存</button></div>';

    /* 王国 */
    html += '<div class="card"><div class="card-head"><h3>国号</h3></div>' +
      '<div class="field"><label>国号</label><input type="text" id="k-name" value="' + esc(k.name) + '"></div>' +
      '<div class="field"><label>自称</label><input type="text" id="k-title" value="' + esc(k.emperorTitle) + '"></div>' +
      '<button class="btn primary sm" data-act="save-kingdom">保存</button></div>';

    html += '<div class="card flat"><p class="muted">大永劫 · 本地版。' +
      '两代协议是方法，王国只是外壳——真正在起作用的是你点下那个按钮的次数。</p></div>';
    return html;
  };

  function kv(k, v) {
    return '<div class="li"><span class="nm">' + esc(k) + '</span>' +
      '<span class="muted">' + esc(v) + '</span></div>';
  }
  function num(id, label, val, hint) {
    return '<div class="field"><label>' + label + '</label>' +
      '<input type="number" id="' + id + '" value="' + esc(val) + '">' +
      (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
  }
  function date(id, label, val, hint) {
    return '<div class="field"><label>' + label + '</label>' +
      '<input type="date" id="' + id + '" value="' + esc(val) + '">' +
      (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
  }
})(window);

</script>
<script>
/* 大永劫 · 应用层：状态、路由、动作、计时、持久化 */
(function (root) {
  'use strict';
  var R = root.DYJ_Rules;
  var V = root.DYJ_V;
  var esc = V.esc;
  var KEY = 'dayongjie.v2';
  var KEY_V1 = 'dayongjie.v1';

  var App = root.DYJ_App = {
    state: null,
    ui: {
      page: 'start', groupId: null, selectedDay: null, pick: null,
      rangeKind: 'month', rangeRef: null, customRange: null, heatMonth: null
    }
  };

  App.now = function () { return Date.now(); };

  /* ---------------- 存档迁移 ---------------- */

  function upgradeV1(o) {
    var d = R.defaultState();
    var A = R.TROOP_ALIAS, GA = R.GROUP_ALIAS;
    // 兵种 id 迁移 + 数据合并
    var carried = {};
    (o.troops || []).forEach(function (t) {
      var nid = A[t.id] || t.id;
      var c = carried[nid] = carried[nid] || { focusMinutes: 0, sessions: 0, fatigue: false, consecutiveAborts: 0 };
      c.focusMinutes += t.focusMinutes || 0;
      c.sessions += t.sessions || 0;
      c.fatigue = c.fatigue || !!t.fatigue;
      c.consecutiveAborts = Math.max(c.consecutiveAborts, t.consecutiveAborts || 0);
    });
    o.troops = d.troops.map(function (t) {
      var c = carried[t.id];
      return c ? Object.assign({}, t, c) : t;
    });
    // 组 id 迁移
    var gmap = {};
    (o.policyGroups || []).forEach(function (g) {
      gmap[g.id] = GA[g.id] || g.id;
    });
    var seen = {};
    o.policyGroups = (o.policyGroups || []).map(function (g) {
      var nid = gmap[g.id];
      var def = d.policyGroups.find(function (x) { return x.id === nid; });
      var ng = Object.assign({}, g, { id: nid, title: g.title || (def ? def.title : '') });
      if (def) { ng.name = def.name; ng.title = def.title; ng.scope = def.scope; }
      if (seen[nid]) return null;
      seen[nid] = 1;
      return ng;
    }).filter(Boolean);
    d.policyGroups.forEach(function (g) { if (!seen[g.id]) o.policyGroups.push(g); });
    // 节点 / 记录 / 目标
    (o.policyNodes || []).forEach(function (n) { n.groupId = gmap[n.groupId] || n.groupId; });
    (o.focusLogs || []).forEach(function (l) { l.troopId = A[l.troopId] || l.troopId; });
    (o.targets || []).forEach(function (t) {
      t.troopIds = (t.troopIds || []).map(function (id) { return A[id] || id; });
    });
    Object.keys(o.dayRecords || {}).forEach(function (k) {
      var gs = o.dayRecords[k].groupStates || {};
      var ng = {};
      Object.keys(gs).forEach(function (id) { ng[gmap[id] || id] = gs[id]; });
      o.dayRecords[k].groupStates = ng;
    });
    // 王国字段
    var k = o.kingdom || {};
    var logs = (o.focusLogs || []).filter(function (l) { return l.result === 'completed'; });
    var days = {};
    logs.forEach(function (l) { days[l.logicalDay] = 1; });
    var sorted = Object.keys(days).sort();
    var best = 0, run = 0, prev = null;
    sorted.forEach(function (dd) {
      run = (prev && R.daysBetween(prev, dd) === 1) ? run + 1 : 1;
      best = Math.max(best, run);
      prev = dd;
    });
    var last = sorted[sorted.length - 1] || null;
    var streak = 0;
    if (last) {
      streak = 1;
      for (var i = sorted.length - 1; i > 0; i--) {
        if (R.daysBetween(sorted[i - 1], sorted[i]) === 1) streak++; else break;
      }
    }
    var attempts = (o.focusLogs || []).length;
    o.kingdom = {
      name: k.name || d.kingdom.name,
      emperorTitle: k.emperorTitle || d.kingdom.emperorTitle,
      lifetimeFocusMinutes: k.lifetimeFocusMinutes || 0,
      totalSessions: k.totalSessions || logs.length,
      attempts: Math.max(attempts, k.totalSessions || 0),
      focusStreak: streak, bestFocusStreak: best, lastFocusDay: last,
      rankId: k.rankId || d.kingdom.rankId,
      highestRankId: k.highestRankId || k.rankId || d.kingdom.highestRankId,
      honors: (k.honors || []).filter(function (id) {
        return R.HONORS.some(function (h) { return h.id === id; });
      }),
      recoveryUntil: null, recoveryReason: null,
      chainNo: k.chainNo || 0, chainBest: k.chainBest || 0,
      createdAt: k.createdAt || Date.now()
    };
    if (o.kingdom.lifetimeFocusMinutes >= 6000 && o.kingdom.honors.indexOf('hundred') < 0) o.kingdom.honors.push('hundred');
    if (o.kingdom.lifetimeFocusMinutes >= 600 && o.kingdom.honors.indexOf('tenhours') < 0) o.kingdom.honors.push('tenhours');
    o.schemaVersion = 2;
    return o;
  }

  function migrate(o) {
    if (!o || typeof o !== 'object') return R.defaultState();
    var d = R.defaultState();
    if ((o.schemaVersion || 1) < 2) { try { o = upgradeV1(o); } catch (e) { console.error('迁移失败，保留原数据', e); } }
    o.schemaVersion = 2;
    ['troops', 'targets', 'policyGroups', 'policyNodes', 'focusLogs', 'reservations',
      'rulings', 'permits', 'settlements', 'quotaLogs', 'audit'].forEach(function (k) {
        if (!Array.isArray(o[k])) o[k] = d[k];
      });
    if (!o.dayRecords || typeof o.dayRecords !== 'object') o.dayRecords = {};
    o.settings = Object.assign({}, d.settings, o.settings || {});
    if (!o.meta) o.meta = d.meta;
    if (!o.runtime) o.runtime = {};
    o.kingdom = Object.assign({}, d.kingdom, o.kingdom || {});
    // 兵种表以代码为准，保留累计数据
    o.troops = d.troops.map(function (t) {
      var old = o.troops.find(function (x) { return x.id === t.id; });
      return old ? Object.assign({}, t, {
        focusMinutes: old.focusMinutes || 0, sessions: old.sessions || 0,
        fatigue: !!old.fatigue, consecutiveAborts: old.consecutiveAborts || 0
      }) : t;
    });
    return o;
  }

  /* ---------------- 存储可用性自检 ----------------
   * 某些浏览器（尤其是手机上的 file:// 页面）会禁用 localStorage。
   * 必须当场发现并告诉用户，否则会白记一个月才发现数据没保存。 */
  function checkStorage() {
    try {
      var k = '__dyj_probe__';
      localStorage.setItem(k, '1');
      var ok = localStorage.getItem(k) === '1';
      localStorage.removeItem(k);
      return ok;
    } catch (e) { return false; }
  }
  App.storageOk = true;

  App.load = function () {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) {
        var v1 = localStorage.getItem(KEY_V1);
        if (v1) return migrate(JSON.parse(v1));
        return R.defaultState();
      }
      return migrate(JSON.parse(raw));
    } catch (e) {
      console.error(e);
      return R.defaultState();
    }
  };

  var saveTimer = null;
  App.save = function (immediate) {
    function write() {
      saveTimer = null;
      try { localStorage.setItem(KEY, JSON.stringify(App.state)); }
      catch (e) { App.toast('保存失败：' + e.message + '，请立刻导出备份。'); }
    }
    if (immediate) { if (saveTimer) clearTimeout(saveTimer); write(); return; }
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(write, 250);
  };

  /* ---------------- 提示 ---------------- */
  App.toast = function (msg, ms) {
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('on'); }, ms || 2600);
  };

  /* ---------------- 弹窗 ---------------- */
  App.modal = function (html) {
    document.getElementById('modal-root').innerHTML =
      '<div class="mask" data-act="mask"><div class="modal">' + html + '</div></div>';
  };
  App.closeModal = function () { document.getElementById('modal-root').innerHTML = ''; };
  App.modalOpen = function () { return !!document.querySelector('#modal-root .mask'); };

  function val(id) { var el = document.getElementById(id); return el ? el.value : ''; }
  function num(id, dflt) { var n = parseInt(val(id), 10); return isNaN(n) ? dflt : n; }

  /* ---------------- 渲染 ---------------- */
  var PAGES = [
    { id: 'start', label: '开始' },
    { id: 'stats', label: '统计' },
    { id: 'rules', label: '国策' },
    { id: 'mine', label: '我的' }
  ];

  App.render = function () {
    var s = App.state, now = App.now();
    document.getElementById('topbar').innerHTML = V.renderTopbar(s);
    var html;
    if (App.ui.page === 'start') html = V.renderStart(s, now);
    else if (App.ui.page === 'stats') html = V.renderStats(s, now, App.ui);
    else if (App.ui.page === 'heat') html = V.renderHeatDetail(s, now, App.ui);
    else if (App.ui.page === 'rules') html = V.renderPolicy(s, now, App.ui);
    else html = V.renderMine(s, now, App.ui);
    document.getElementById('view').innerHTML = html;
    document.getElementById('nav').innerHTML = '<div class="nav-in">' + PAGES.map(function (p) {
      var on = App.ui.page === p.id || (p.id === 'stats' && App.ui.page === 'heat');
      return '<button class="' + (on ? 'on' : '') + '" data-act="go:' + p.id + '">' + p.label + '</button>';
    }).join('') + '</div>';
  };

  App.go = function (page) {
    App.ui.page = page;
    if (page === 'rules' && !App.ui.groupId) App.ui.groupId = App.state.policyGroups[0] && App.state.policyGroups[0].id;
    App.render();
    window.scrollTo({ top: 0 });
  };

  App.refresh = function () {
    var out = R.runSettlement(App.state, App.now());
    out.alerts.forEach(function (a, i) { if (i < 2) App.toast(a, 4200); });
    if (out.recoveryStarted) {
      App.modal('<h2>欢迎回来</h2>' +
        '<p>你有几天没记录了。这很正常，不用自责——断档本身说明之前的路径还不够稳。</p>' +
        '<div class="alert info">接下来 7 天是<b>重建期</b>：国策不会因为你没做到而崩坏，' +
        '你要做的只有一件事——<b>坐 5 分钟</b>。</div>' +
        '<div class="foot"><button class="btn primary" data-act="close-modal">好</button></div>');
    }
    App.save();
    App.render();
  };

  /* ---------------- 计时器 ---------------- */
  function mmss(sec) {
    sec = Math.max(0, sec);
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function tick() {
    var s = App.state, now = App.now();
    var sess = s.runtime && s.runtime.activeSession;
    if (sess) {
      var el = document.getElementById('live-session');
      if (el) {
        var sec = Math.floor((now - sess.startedAt) / 1000);
        el.textContent = mmss(sec);
        if (sec > sess.plannedMinutes * 60) el.classList.add('over');
      }
    }
    var resv = s.runtime && s.runtime.activeReservation;
    if (resv) {
      var el2 = document.getElementById('live-reservation');
      if (el2) {
        var left = Math.floor((resv.deadlineAt - now) / 1000);
        el2.textContent = left > 0 ? mmss(left) : '00:00';
        if (left <= 0) { el2.classList.add('blink'); }
      }
      if (now > resv.deadlineAt + 60000 && resv.status === 'pending') {
        R.lapseReservation(s, now);
        R.openRuling(s, 'suspected_violation', '打响指后没能坐上座位', now, []);
        App.save(true); App.render();
      }
    }
  }

  /* ---------------- 动作 ---------------- */

  function startNow(troopId, mins, taskName) {
    var s = App.state, now = App.now();
    if (s.runtime && s.runtime.activeSession) { App.toast('已经有一个在进行中了'); return; }
    mins = Math.max(1, mins || s.settings.defaultPlanMinutes || 10);
    if (R.startSession(s, troopId, mins, null, now, taskName)) {
      App.closeModal(); App.save(true); App.render();
      App.toast(mins + ' 分钟，开始。');
    }
  }

  var ACTS = {
    'go': function (p) { App.closeModal(); App.go(p); },
    'close-modal': function () { App.closeModal(); },
    'mask': function () { App.closeModal(); },

    /* --- 开始 --- */
    'quick-start': function () {
      var s = App.state;
      startNow(s.settings.lastTroopId, s.settings.defaultPlanMinutes);
    },
    'pick-troop': function () {
      App.ui.pick = { troopId: App.state.settings.lastTroopId, minutes: App.state.settings.defaultPlanMinutes };
      App.modal(V.troopPicker(App.state, App.now(), App.state.settings.planPresets));
    },
    'choose-troop': function (id) {
      App.ui.pick = App.ui.pick || {};
      App.ui.pick.troopId = id;
      App.modal(V.troopPicker(App.state, App.now(), App.state.settings.planPresets));
    },
    'choose-min': function (m) {
      App.ui.pick = App.ui.pick || {};
      App.ui.pick.minutes = parseInt(m, 10);
      App.modal(V.troopPicker(App.state, App.now(), App.state.settings.planPresets));
    },
    'start-chosen': function () {
      var p = App.ui.pick || {};
      var custom = parseInt(val('f-custom'), 10);
      var mins = isNaN(custom) ? (p.minutes || App.state.settings.defaultPlanMinutes) : custom;
      startNow(p.troopId || App.state.settings.lastTroopId, mins, val('f-task'));
    },

    /* --- 国策确认 --- */
    'toggle-node': function (nodeId) {
      var s = App.state, now = App.now();
      var day = R.todayKey(s, now);
      var node = s.policyNodes.find(function (n) { return n.id === nodeId; });
      if (!node) return;
      var st = R.nodeStateFor(s, day, node);
      var next = st === 'lit' ? 'out' : 'lit';
      if (!R.confirmNode(s, day, nodeId, next, now)) App.toast('今天已经结算了，明天再说。');
      else App.save(true);
      App.render();
    },
    'confirm-all': function () {
      var s = App.state, now = App.now();
      var n = R.confirmAll(s, R.todayKey(s, now), now);
      App.save(true); App.render();
      App.toast(n ? '全部记为做到了' : '没有需要确认的');
    },

    /* --- 预约 --- */
    'reserve': function () {
      var r = R.makeReservation(App.state, '响指', App.now());
      App.save(true); App.render();
      if (r) App.toast('打响指了。14 分 30 秒内坐下就行。');
    },
    'seat': function () {
      var res = R.seatReservation(App.state, App.now());
      App.save(true); App.render();
      if (res.ok) App.toast(res.late ? '坐下了，虽然超了点时间。' : '坐下了。');
    },
    'lapse': function () {

    'edit-node': function (id) { nodeForm(id); },
    'save-node': function (id, forcedParent) {
      var s = App.state, now = App.now();
      var name = (val('f-name') || '').trim();
      if (!name) { App.toast('写个名字吧'); return; }
      var chosenParent = val('f-parent') || forcedParent || null;
      var chosenGroup = val('f-group');
      if (!chosenGroup && chosenParent) {
        var pg = s.policyNodes.find(function (x) { return x.id === chosenParent; });
        if (pg) chosenGroup = pg.groupId;
      }
      if (!chosenGroup) chosenGroup = App.ui.groupId || (s.policyGroups[0] && s.policyGroups[0].id);
      var data = {
        name: name, type: val('f-type') || 'semi', groupId: chosenGroup,
        parentId: chosenParent, trigger: (val('f-trigger') || '').trim(),
        note: (val('f-note') || '').trim(), isRoot: !!document.getElementById('f-root').checked
      };
      var trialDays = num('f-trial', 3);
      var today = R.logicalDay(now, s.settings.dayBoundaryHour);
      if (id) {
        var n = s.policyNodes.find(function (x) { return x.id === id; });
        if (data.parentId === id) data.parentId = null;
        if (data.groupId !== n.groupId) data.parentId = null;
        Object.assign(n, data);
        n.trialEndsAt = trialDays > 0 ? R.addDays(today, trialDays) : null;
      } else {
        if (data.parentId) {
          var par = s.policyNodes.find(function (x) { return x.id === data.parentId; });
          if (par) data.groupId = par.groupId;
        }
        s.policyNodes.push(Object.assign({
          id: R.uid('n'), status: 'lit', createdAt: now,
          trialEndsAt: trialDays > 0 ? R.addDays(today, trialDays) : null,
          trialFails: 0, internalization: 0, streak: 0, bestStreak: 0, totalLit: 0,
          lastConfirmedDay: null, useCount: 0
        }, data));
      }
      App.ui.groupId = data.groupId;
      App.closeModal(); App.save(true); App.render();
      App.toast(id ? '改好了' : '加好了。前几天做不到也不算崩塌。');
    },
    'del-node': function (id) {
      var s = App.state, n = s.policyNodes.find(function (x) { return x.id === id; });

    /* --- 元规则 --- */
    'quota': function (n) {

      n = parseInt(n, 10);

      if (rec.entertainmentMinutes > s.settings.entertainmentQuotaMinutes) {
        var has = s.rulings.some(function (r) { return r.logicalDay === day && r.kind === 'quota_exceeded' && !r.decision; });
        if (!has) { R.openRuling(s, 'quota_exceeded', '娱乐时间超出每天配额', App.now(), []); App.toast('超了。要不要把它定成一条正式规则？'); }

    'export': function () {
      var s = App.state;
      s.meta.lastExportAt = App.now();
      var data = JSON.stringify(s);
      var blob = new Blob([data], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = '大永劫备份_' + R.todayKey(s, App.now()) + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      App.save(true); App.render();
      App.toast('导出完成（' + Math.round(data.length / 1024) + ' KB）');
    },
    'import': function () {
      var inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.json,application/json';
      inp.onchange = function () {
        var f = inp.files && inp.files[0];
        if (!f) return;
        var r = new FileReader();
        r.onload = function () {
          try {
            var o = JSON.parse(r.result);
            if (!o || !o.kingdom) throw new Error('这不像本软件的备份');
            App.state = migrate(o);
            App.state.audit.push({ at: App.now(), type: 'import', detail: { file: f.name } });
            App.save(true); App.go('start');
            App.toast('导入完成');
          } catch (e) { App.toast('导入失败：' + e.message, 4200); }
        };
        r.readAsText(f);
      };
      inp.click();
    },
    'wipe': function () {
      App.modal('<h2>清空全部数据</h2>' +
        '<div class="alert warn">所有记录、国策、军衔都会消失，不能恢复。先导出备份吧。</div>' +

      App.toast('重新开始。');
    }

  /* ---------------- 表单 ---------------- */
  function nodeForm(id, groupId, parentId) {
    var s = App.state;
    var n = id ? s.policyNodes.find(function (x) { return x.id === id; }) : null;
    var gid = n ? n.groupId : (groupId || s.policyGroups[0].id);
    var pid = n ? n.parentId : (parentId || null);
    var same = s.policyNodes.filter(function (x) {
      return x.groupId === gid && x.status !== 'removed' && (!id || x.id !== id);
    });
    App.modal('<h2>' + (id ? '编辑国策' : '加一条国策') + '</h2>' +
      '<div class="field"><label>做什么</label><input type="text" id="f-name" value="' + esc(n ? n.name : '') +
      '" placeholder="进家门 15 分钟内换运动服"></div>' +
      '<div class="field"><label>类型</label><select id="f-type">' +
      R.NODE_TYPE_ORDER.map(function (t) {
        return '<option value="' + t + '"' + (n && n.type === t ? ' selected' : '') + '>' +
          R.NODE_TYPES[t].name + ' — ' + R.NODE_TYPES[t].desc + '</option>';
      }).join('') + '</select>' +
      '<div class="hint">被动 &gt; 半被动 &gt; 主动。能用被动就别用主动，决策负担差很多。</div></div>' +
      '<div class="field"><label>属于哪一组</label><select id="f-group">' +
      s.policyGroups.map(function (g) {
        return '<option value="' + g.id + '"' + (g.id === gid ? ' selected' : '') + '>' + esc(g.name) + '</option>';
      }).join('') + '</select></div>' +
      '<div class="field"><label>挂在哪条下面（可选）</label><select id="f-parent"><option value="">（作为根节点）</option>' +
      same.map(function (x) {
        return '<option value="' + x.id + '"' + (x.id === pid ? ' selected' : '') + '>' + esc(x.name) + '</option>';
      }).join('') + '</select></div>' +
      '<div class="field"><label>挂靠在什么动作上（半被动型用）</label><input type="text" id="f-trigger" value="' +
      esc(n ? n.trigger || '' : '') + '" placeholder="进家门 / 吃完饭 / 起床"></div>' +
      '<div class="field"><label>试用期几天（这几天失败不算崩塌）</label><input type="number" id="f-trial" value="3" min="0" max="30"></div>' +
      '<div class="field"><label>备注</label><input type="text" id="f-note" value="' + esc(n ? n.note || '' : '') + '"></div>' +
      '<div class="field"><label><input type="checkbox" id="f-root"' + (n && n.isRoot ? ' checked' : '') +
      '> 标为根国策（保证整个系统还在运转）</label></div>' +
      '<div class="foot"><button class="btn" data-act="close-modal">取消</button>' +
      '<button class="btn primary" data-act="save-node:' + (id || '') + ':' + (pid || '') + '">保存</button></div>');
  }

  function groupForm(id) {
    var s = App.state;
    var g = id ? s.policyGroups.find(function (x) { return x.id === id; }) : null;
    var sc = (g && g.scope) || { mode: 'global', weight: 0.5 };
    App.modal('<h2>' + (id ? '改组设置' : '新建一组') + '</h2>' +
      '<div class="field"><label>组名（用大白话）</label><input type="text" id="g-name" value="' + esc(g ? g.name : '') +
      '" placeholder="作息"></div>' +
      '<div class="field"><label>副标题（想写世界观名就写这儿）</label><input type="text" id="g-title" value="' +
      esc(g ? g.title || '' : '') + '" placeholder="司晨殿"></div>' +
      '<div class="field"><label>出问题时影响谁</label><select id="g-scope">' +
      '<option value="global"' + (sc.mode === 'global' ? ' selected' : '') + '>不区分（全局提示）</option>' +
      '<option value="troops"' + (sc.mode === 'troops' ? ' selected' : '') + '>只影响指定的事</option>' +
      '<option value="none"' + (sc.mode === 'none' ? ' selected' : '') + '>只做记录，不影响任何判断</option>' +
      '</select></div>' +
      '<div class="field"><label>权重（0–1）</label><input type="number" id="g-weight" value="' +
      (sc.weight == null ? 0.5 : sc.weight) + '" step="0.1" min="0" max="1"></div>' +
      '<div class="field"><label>影响哪些事</label><div class="row tight">' +
      s.troops.map(function (t) {
        var on = (sc.troopIds || []).indexOf(t.id) >= 0;
        return '<label class="tag" style="cursor:pointer"><input type="checkbox" class="g-troop" value="' + t.id + '"' +
          (on ? ' checked' : '') + '> ' + esc(t.label) + '</label>';
      }).join('') + '</div></div>' +
      '<div class="field"><label><input type="checkbox" id="g-nocollapse"' + (g && g.noCollapse ? ' checked' : '') +
      '> 这一组永不崩坏</label><div class="hint">存放元规则（比如"这个系统本身要运转"）的组应该勾上。</div></div>' +
      '<div class="foot"><button class="btn" data-act="close-modal">取消</button>' +
      '<button class="btn primary" data-act="save-group:' + (id || '') + '">保存</button></div>');
  }

  /* ---------------- 事件 ---------------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'mask' && !(e.target.classList && e.target.classList.contains('mask'))) return;
    var parts = act.split(':');
    var cmd = parts.shift();
    var fn = ACTS[cmd];
    if (!fn) return;
    e.preventDefault();
    fn.apply(null, parts);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && App.modalOpen()) App.closeModal();
  });

  /* ---------------- 启动 ---------------- */
  App.boot = function () {
    App.storageOk = checkStorage();
    App.state = App.load();
    var s = App.state, now = App.now();
    if (!s.meta.onboarded) {
      s.meta.onboarded = true;
      App.save(true);
      setTimeout(welcome, 300);
    }
    var sess = s.runtime && s.runtime.activeSession;
    if (sess && now - sess.startedAt > (sess.plannedMinutes + 5) * 60000) {
      var t = R.troopById(s, sess.troopId);
      App.modal('<h2>上次没结算</h2>' +
        '<p>「' + esc(t ? t.label : '') + '」计划 ' + sess.plannedMinutes + ' 分钟，已经过去 ' +
        Math.round((now - sess.startedAt) / 60000) + ' 分钟。</p>' +
        '<div class="foot"><button class="btn danger" data-act="end-abort-ok">算中断</button>' +
        '<button class="btn primary" data-act="end-complete">算完成</button></div>');
    }
    App.ui.selectedDay = R.todayKey(s, now);
    App.ui.heatMonth = R.todayKey(s, now).slice(0, 8) + '01';
    App.ui.rangeRef = R.todayKey(s, now);
    App.go('start');
    App.refresh();
    setInterval(tick, 1000);
    setInterval(function () { if (!App.modalOpen()) App.refresh(); }, 60000);
    window.addEventListener('beforeunload', function () { App.save(true); });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) App.refresh(); });
  };

  function welcome() {
    App.modal('<h2>就一件事</h2>' +
      '<p>这个软件只帮你做一件事：<b>坐下来，开始</b>。</p>' +
      '<div class="alert info">首页那个大按钮点一下就开始计时，5 分钟也算。' +
      '做完点「完成」，分钟数就永久记下了——<b>永远不会被打折、被扣除</b>。</div>' +
      '<p class="muted">国策那几条只是起步建议，随时可以改、删、加。前 30 天你断档了也不会崩坏。' +
      '如果几天没来，回来会进入「重建期」，目标自动降到最低。</p>' +
      '<div class="foot"><button class="btn primary" data-act="close-modal">开始</button></div>');
  }

  root.addEventListener('DOMContentLoaded', App.boot);
})(window);

</script>
<script>
// 只有通过 http(s) 打开时才注册 Service Worker（file:// 下浏览器不允许）。
// 作用：把应用缓存到本机，之后即使电脑关机 / 断网也能用。
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
</html>
